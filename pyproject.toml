[project]
name = "gauss-meridian"
version = "0.1.0"
description = "Meridian SDK for Python: chat, streaming, provisioning and forwarding for the Meridian engine."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]
keywords = ["meridian", "gauss", "ai", "llm", "sdk", "streaming", "fastapi", "django", "flask"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Gaussian-id/meridian-python"
Repository = "https://github.com/Gaussian-id/meridian-python"
Issues = "https://github.com/Gaussian-id/meridian-python/issues"

[project.optional-dependencies]
fastapi = ["fastapi>=0.110"]
django = ["django>=4.2"]
flask = ["flask>=3.0"]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pyright>=1.1.380",
  "pytest>=8",
  "anyio>=4",
  "datamodel-code-generator==0.83.0",
  "black==26.10.0",
  "isort==8.0.1",
  "fastapi>=0.110",
  "django>=4.2",
  "flask>=3.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gauss_meridian"]

# The sdist holds the package source and nothing else of the repository (no tests, scripts, specs or local files)
[tool.hatch.build.targets.sdist]
only-include = ["src/gauss_meridian", "README.md", "LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["src/gauss_meridian/_generated"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = [
  "fake_only: needs the in-memory fake engine; skipped in contract mode",
  "contract: needs the real local engine; skipped unless MERIDIAN_CONTRACT=1 (run scripts/contract.py)",
]
