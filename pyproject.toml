[project]
name = "meridian"
version = "0.0.0"
description = "Meridian SDK for Python: chat, streaming, provisioning and forwarding for the Meridian engine."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]
classifiers = ["Private :: Do Not Upload"]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110"]
django = ["django>=4.2"]
flask = ["flask>=3.0"]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pyright>=1.1.380",
  "pytest>=8",
  "anyio>=4",
  "datamodel-code-generator>=0.26",
  "fastapi>=0.110",
  "django>=4.2",
  "flask>=3.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["src/meridian/_generated"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["fake_only: needs the in-memory fake engine; skipped in contract mode"]
